[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-validation-toolkit"
version = "0.1.0"
description = "From-scratch reimplementation of core quant research validation tooling: purged walk-forward with embargo, IC/Rank IC, PSR/DSR, factor neutralization, rolling IC/decay."
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.23",
    "yfinance>=0.2.55",
    "requests>=2.32",
]

[tool.setuptools.packages.find]
where = ["src"]
